<style>

<header><div class="wrap"><h1>微生物遺伝学｜小テスト対策</h1><p>講義資料（第2〜5回）・過去問をもとにした4択63問</p></div></header>
<main class="wrap">
<section class="panel">
 <div class="stats"><div class="stat">全63問</div><div class="stat">4択・解説つき</div><div class="stat">間違えた問題を復習</div></div>

 </div>

 <div class="list" id="historyList"></div>
 <div class="actions"><button class="secondary" id="clearHistory">学習履歴を消去</button><button class="secondary" id="clearWrong">間違えた問題をリセット</button></div>

</section>
</main><footer>※講義資料に記載された内容を中心に構成。講義資料にない細部は出題対象にしていません。</footer>

const data=raw.map((r,i)=>({id:i+1,cat:r[0],q:r[1],a:r[2],opts:r.slice(2,6),exp:r[6]}));
const cats={gene:"第2回：遺伝子・転写・翻訳",rep1:"第3回：DNA複製の基本",rep2:"第4回：DNA複製に関わる酵素",cycle:"第5回：細胞周期・複製開始の調節",past:"過去問形式：総合確認"};
const STORAGE_KEY="microbiology_genetics_quiz63_v1";
let pool=[],pos=0,score=0,answered=false,wrong=new Set(),lastCat="all";
let history=[];
function loadSaved(){
 try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
  wrong=new Set(Array.isArray(saved.wrong)?saved.wrong:[]);
  history=Array.isArray(saved.history)?saved.history:[];
 }catch(e){wrong=new Set();history=[];}
}
function saveSaved(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify({wrong:[...wrong],history}));}
 catch(e){$("historySummary").textContent="このブラウザでは保存できませんでした。プライベートブラウズ設定などをご確認ください。";}
}
function renderHistory(){
 const sessions=history.length;
 const answeredTotal=history.reduce((s,h)=>s+h.total,0);
 const correctTotal=history.reduce((s,h)=>s+h.score,0);
 $("totalSessions").textContent=sessions;
 $("totalAnswered").textContent=answeredTotal;
 $("overallRate").textContent=answeredTotal?Math.round(correctTotal/answeredTotal*100)+"%":"—";
 $("historySummary").textContent=sessions?`累計正解：${correctTotal}問 ／ 累計不正解：${answeredTotal-correctTotal}問`:"学習履歴はまだありません。";
 $("historyList").innerHTML="";
 history.slice().reverse().slice(0,20).forEach(h=>{
  const d=document.createElement("div");d.className="reviewitem";
  const date=new Date(h.date);
  const stamp=isNaN(date.getTime())?h.date:date.toLocaleString("ja-JP");
  const modeName=h.mode==="all"?"すべて":h.mode==="wrong"?"間違えた問題":(cats[h.mode]||h.mode);
  const title=document.createElement("b");title.textContent=`${stamp}｜${modeName}`;
  const detail=document.createElement("div");detail.className="small";
  detail.textContent=`${h.score}/${h.total}問正解（${h.rate}%）`;
  d.append(title,detail);$("historyList").appendChild(d);
 });
}
const $=id=>document.getElementById(id);
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(mode){lastCat=mode||$("category").value;pool=lastCat==="all"?data.filter(x=>x.cat!=="past"):lastCat==="wrong"?data.filter(x=>wrong.has(x.id)):data.filter(x=>x.cat===lastCat);pool=shuffle(pool);pos=0;score=0;answered=false;$("result").classList.add("hidden");$("quiz").classList.remove("hidden");$("start").classList.add("hidden");$("next").classList.remove("hidden");render()}
function render(){if(pos>=pool.length){finish();return}let x=pool[pos];answered=false;$("meta").textContent=`${cats[x.cat]}　｜　問題 ${pos+1}/${pool.length}`;$("qtext").textContent=x.q;$("options").innerHTML="";$("feedback").innerHTML="";$("next").disabled=true;$("next").textContent=pos===pool.length-1?"結果を見る":"次の問題";$("progressText").textContent=`${pos}/${pool.length} 問回答　・　正解 ${score} 問`;$("bar").style.width=`${pos/pool.length*100}%`;
let opts=shuffle(x.opts.map((v,i)=>({v,correct:i===0})));opts.forEach((o,i)=>{let b=document.createElement("button");b.className="opt";b.textContent=`${"ABCD"[i]}. ${o.v}`;b.onclick=()=>choose(i,opts);$("options").appendChild(b)})}
function choose(i,opts){if(answered)return;answered=true;let x=pool[pos],correct=opts[i].correct;if(correct)score++;else {wrong.add(x.id);saveSaved();}[...$("options").children].forEach((b,j)=>{b.disabled=true;if(opts[j].correct)b.classList.add("correct");if(j===i&&!correct)b.classList.add("wrong")});$("feedback").className="feedback "+(correct?"good":"bad");$("feedback").innerHTML=`<b>${correct?"正解！":"不正解"}</b><br>正解：${x.a}<br><br>${x.exp}`;$("next").disabled=false;$("progressText").textContent=`${pos+1}/${pool.length} 問回答　・　正解 ${score} 問`;updateWrong()}
function finish(){
 if(pool.length){
  history.push({date:new Date().toISOString(),mode:lastCat,score,total:pool.length,rate:Math.round(score/pool.length*100)});
  if(history.length>100)history=history.slice(-100);
  saveSaved();renderHistory();
 }
 $("quiz").classList.add("hidden");$("result").classList.remove("hidden");$("score").textContent=`${score} / ${pool.length} 問正解`;$("resultText").textContent=pool.length?`正答率 ${Math.round(score/pool.length*100)}%。${score===pool.length?"全問正解！すばらしい！":"解説を確認して、間違えた問題をもう一度解いてみよう。"}`:"対象の問題がありません。";$("bar").style.width="100%";updateWrong()}
function updateWrong(){$("wrongCount").textContent=`${wrong.size}問が復習リストに入っています。`;$("wrongList").innerHTML="";[...wrong].sort((a,b)=>a-b).forEach(id=>{let x=data.find(q=>q.id===id);let d=document.createElement("div");d.className="reviewitem";d.innerHTML=`<b>Q${id}｜${x.q}</b><div class="small">正解：${x.a}</div>`;$("wrongList").appendChild(d)})}
$("start").onclick=()=>start();$("next").onclick=()=>{if(!answered)return;pos++;render()};$("restart").onclick=()=>start($("category").value);$("again").onclick=()=>start(lastCat);$("retryWrong").onclick=()=>{if(!wrong.size)return;start("wrong")};$("category").onchange=()=>{$("start").classList.remove("hidden");$("next").classList.add("hidden");$("qtext").textContent="「スタート」を押して始めよう。";$("meta").textContent="出題範囲を選択中";$("options").innerHTML="";$("feedback").innerHTML="";$("result").classList.add("hidden");$("quiz").classList.remove("hidden")};$("clearHistory").onclick=()=>{
 if(!confirm("学習履歴をすべて消去しますか？"))return;
 history=[];saveSaved();renderHistory();
};
$("clearWrong").onclick=()=>{
 if(!confirm("間違えた問題の記録をすべて消去しますか？"))return;
 wrong.clear();saveSaved();updateWrong();
};
loadSaved();updateWrong();renderHistory();
</script></body></html>
